<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STO(MA)CK — PROJECTOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root{
    --bg-0:#03070a; --bg-1:#04100c;
    --green:#2ee66b; --green-dim:#1b8a45; --green-glow:rgba(46,230,107,0.35);
    --amber:#ffb347; --sell:#ff5c5c; --ink:#b8f5cf; --muted:#4f7a63;
    --font-dot:'Doto','DotGothic16',monospace;
    --font-term:'Share Tech Mono','VT323','Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg-0);color:var(--green);font-family:var(--font-term);overflow:hidden;cursor:none;}
  #bg{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(circle at 50% 40%, rgba(46,230,107,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(46,230,107,0.04) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(90deg, rgba(46,230,107,0.04) 0 1px, transparent 1px 60px),
      var(--bg-0);}
  #scan{position:fixed;inset:0;z-index:40;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 2px, transparent 2px 4px);opacity:.5;}
  #vig{position:fixed;inset:0;z-index:41;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,0.9);}
  .wrap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;}
  header{display:flex;justify-content:space-between;align-items:center;padding:2.4vh 3vw;
    letter-spacing:4px;font-size:clamp(12px,1.5vw,20px);color:var(--muted);text-transform:uppercase;}
  header .brand{color:var(--green);text-shadow:0 0 18px var(--green-glow);font-weight:700;}
  header .live{display:flex;align-items:center;gap:10px;}
  header .dot{width:12px;height:12px;border-radius:50%;background:var(--sell);box-shadow:0 0 12px var(--sell);}
  header .dot.on{background:var(--green);box-shadow:0 0 14px var(--green);animation:pulse 1.4s infinite;}
  @keyframes pulse{50%{opacity:.4;}}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 4vw 4vh;text-align:center;}
  .label{color:var(--amber);letter-spacing:6px;font-size:clamp(14px,2vw,26px);text-transform:uppercase;margin-bottom:2.2vh;}
  .huge{font-family:var(--font-dot);font-weight:900;line-height:.98;text-shadow:0 0 30px var(--green-glow);}
  @keyframes fade{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  .holo{position:relative;width:min(46vh,80vw);aspect-ratio:3/4;border:2px solid var(--green-dim);
    border-radius:10px;overflow:hidden;box-shadow:0 0 60px var(--green-glow), inset 0 0 60px rgba(46,230,107,0.14);background:#020a06;}
  .holo video{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.05) contrast(1.06) saturate(1.15);}
  .holo .grid{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(46,230,107,0.10) 0 1px, transparent 1px 5px);}
  .holo .beam{position:absolute;inset-inline:0;height:4px;top:0;background:var(--green);
    box-shadow:0 0 22px 6px var(--green-glow);opacity:.85;animation:beam 3s ease-in-out infinite;}
  @keyframes beam{0%,100%{top:0;}50%{top:calc(100% - 4px);}}
  .identify-name{margin-top:2.6vh;}
  .identify-name .n{font-family:var(--font-dot);font-weight:900;font-size:clamp(30px,6vw,90px);text-shadow:0 0 30px var(--green-glow);}
  .identify-name .sub{color:var(--muted);letter-spacing:5px;font-size:clamp(12px,1.6vw,20px);margin-top:.8vh;}
  .idflex{display:flex;flex-direction:column;align-items:center;animation:fade .6s ease;}
  .caret::after{content:'▌';animation:blink 1s steps(1) infinite;color:var(--green);}
  @keyframes blink{50%{opacity:0;}}

  .aura-orb{width:min(34vh,60vw);aspect-ratio:1;border-radius:50%;margin:0 auto 3vh;filter:blur(2px);animation:breathe 3s ease-in-out infinite;}
  @keyframes breathe{50%{transform:scale(1.08);}}

  .bars{display:flex;gap:1.2vw;align-items:flex-end;height:34vh;justify-content:center;}
  .bars i{width:2.2vw;background:linear-gradient(180deg,var(--green),var(--green-dim));border-radius:4px 4px 0 0;box-shadow:0 0 16px var(--green-glow);animation:eq 1s ease-in-out infinite;}
  @keyframes eq{50%{height:22%;}}

  .cards{display:flex;gap:2.4vw;justify-content:center;align-items:stretch;flex-wrap:wrap;}
  .card{width:min(24vh,30vw);aspect-ratio:3/4;border:2px solid var(--amber);border-radius:12px;overflow:hidden;
    background:#0a0803;box-shadow:0 0 40px rgba(255,179,71,0.25);display:flex;flex-direction:column;opacity:0;transform:rotateY(90deg);animation:flip .7s ease forwards;}
  .card img{width:100%;flex:1;object-fit:cover;display:block;}
  .card .cn{padding:1vh;color:var(--amber);letter-spacing:2px;font-size:clamp(11px,1.3vw,18px);text-align:center;}
  .card .cl{color:var(--muted);font-size:clamp(9px,1vw,13px);letter-spacing:3px;}
  @keyframes flip{to{opacity:1;transform:none;}}

  .kv{display:flex;gap:3vw;justify-content:center;flex-wrap:wrap;margin-top:2vh;}
  .kv .cell{min-width:16vw;}
  .kv .k{color:var(--muted);letter-spacing:3px;font-size:clamp(11px,1.2vw,16px);}
  .kv .v{font-family:var(--font-dot);font-weight:700;font-size:clamp(20px,3vw,44px);color:var(--ink);}

  .hint{position:fixed;bottom:2vh;left:0;right:0;text-align:center;color:var(--muted);letter-spacing:3px;font-size:12px;z-index:60;opacity:.5;}
</style>
</head>
<body>
  <div id="bg"></div>
  <div class="wrap">
    <header>
      <div class="brand">STO(MA)CK&nbsp;::&nbsp;LIVE READING</div>
      <div class="live"><span class="dot" id="dot"></span><span id="status">CONNECTING…</span></div>
    </header>
    <div class="stage" id="stage"></div>
  </div>
  <div id="scan"></div>
  <div id="vig"></div>
  <div class="hint" id="hint">click anywhere for fullscreen</div>

<script>
/* ערוץ זמן-אמת — זהה ל-const RT שב-index.html */
const RT = { url:'wss://broker.hivemq.com:8884/mqtt', topic:'stomack/oshrit-h7k2/v1/cue' };

/* מיפוי שם→מדיה (עותק מ-index.html) כדי שגם הודעה "רזה" תדע להציג את הסרטון */
const NAME_MEDIA = [
  { names:['שרון רהב'],   type:'video', src:'media/sharon-rahav-rev.mp4' },
  { names:['מיכאל ששון'], type:'video', src:'media/michael-sasson-rev.mp4' },
  { names:['מיכל קסטיאל'],type:'video', src:'media/michal-kastiel-rev.mp4' }
];
function normName(s){ return (s||'').toLowerCase().replace(/[\u0591-\u05C7]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' '); }
function levenshtein(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j),c=new Array(n+1);for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++){const co=a[i-1]===b[j-1]?0:1;c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+co);}[p,c]=[c,p];}return p[n];}
function matchMedia(input){const q=normName(input);if(!q)return null;for(const e of NAME_MEDIA){for(const nm of e.names){const t=normName(nm);if(!t)continue;const d=levenshtein(q,t);const sim=1-d/Math.max(q.length,t.length);const tol=Math.max(1,Math.round(t.length*0.15));if(q===t||sim>=0.85||d<=tol)return e;}}return null;}

const stage=document.getElementById('stage');
const dot=document.getElementById('dot');
const statusEl=document.getElementById('status');
let cur={key:''};

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setStage(html){ stage.innerHTML='<div class="idflex">'+html+'</div>'; }
function bars(n){ let h=''; for(let i=0;i<n;i++){h+='<i style="height:'+(30+Math.random()*70)+'%;animation-delay:'+(Math.random()*0.8).toFixed(2)+'s"></i>';} return '<div class="bars">'+h+'</div>'; }

function renderIdle(){
  setStage('<div class="label">awaiting subject</div>'+
    '<div class="huge" style="font-size:clamp(34px,8vw,120px)">STO(MA)CK</div>'+
    '<div class="identify-name"><div class="sub">SCAN THE CODE TO BEGIN YOUR READING</div></div>');
}
function renderIdentify(m){
  const name=(m.name||m.nameInput||'').trim();
  const src=m.mediaSrc;
  if(src){
    setStage('<div class="holo"><video src="'+esc(src)+'" autoplay muted playsinline loop></video><div class="grid"></div><div class="beam"></div></div>'+
      '<div class="identify-name"><div class="n">'+esc(name||'—')+'</div><div class="sub">IDENTITY LOCKED</div></div>');
  } else {
    setStage('<div class="label">identifying</div>'+
      '<div class="huge caret" style="font-size:clamp(28px,6vw,90px)">'+esc(name||'')+'</div>'+
      '<div class="identify-name"><div class="sub">READING THE SIGNAL…</div></div>');
  }
}
function renderSubject(m){
  const s=m.state||{};
  setStage('<div class="label">the subject</div>'+
    '<div class="huge" style="font-size:clamp(30px,7vw,100px)">'+esc((s.subject||'—').toUpperCase())+'</div>'+
    '<div class="identify-name"><div class="sub">'+esc(m.name||'')+'</div></div>');
}
function renderQuestions(m){
  const s=m.state||{};
  const cell=(k,v)=>'<div class="cell"><div class="k">'+k+'</div><div class="v">'+esc(v||'—')+'</div></div>';
  setStage('<div class="label">gut instinct</div>'+
    '<div class="kv">'+cell('ACT',(s.act||'').toUpperCase())+cell('HOPE',(s.hope||'').toUpperCase())+cell('FEAR',(s.fear||'').toUpperCase())+cell('CONFIDENCE',(s.confidence!=null?s.confidence+'%':''))+'</div>');
}
function renderBody(m){
  const s=m.state||{}; const col=s.auraColor; const hex=col&&col.hex?col.hex:'#2ee66b';
  setStage('<div class="label">biometric scan</div>'+
    '<div class="aura-orb" style="background:radial-gradient(circle at 40% 35%, '+hex+', transparent 70%);box-shadow:0 0 90px '+hex+'"></div>'+
    '<div class="kv">'+
      '<div class="cell"><div class="k">AURA</div><div class="v" style="color:'+hex+'">'+esc(col?col.n:'—')+'</div></div>'+
      '<div class="cell"><div class="k">STILLNESS</div><div class="v">'+esc(s.steadiness!=null?s.steadiness+'%':'—')+'</div></div>'+
    '</div>');
}
function renderVoice(){ setStage('<div class="label">voice stress analysis</div>'+bars(24)); }
function renderCognitive(){ setStage('<div class="label">cognitive load</div>'+bars(18)); }
function renderWheel(m){
  const s=m.state||{};
  setStage('<div class="label">the wheel of fate</div>'+
    '<div class="huge" style="font-size:clamp(28px,6vw,88px);color:var(--amber);text-shadow:0 0 30px rgba(255,179,71,0.4)">'+esc(s.wheelResult||'…')+'</div>');
}
function renderRitual(m){
  const s=m.state||{}; const cards=Array.isArray(s.cards)?s.cards:[];
  if(!cards.length){ setStage('<div class="label">the cards are turning</div><div class="huge" style="font-size:clamp(24px,4vw,60px)">'+esc(m.name||'')+'</div>'); return; }
  let h='<div class="label">the reading</div><div class="cards">';
  cards.forEach((c,i)=>{
    const img=c.img?'<img src="'+esc(c.img)+'" alt="">':'<div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:6vh">'+esc(c.s||'✦')+'</div>';
    h+='<div class="card" style="animation-delay:'+(i*0.5)+'s">'+img+'<div class="cn">'+esc(c.n||'')+'<div class="cl">'+esc(c.lbl||'')+'</div></div></div>';
  });
  h+='</div>';
  setStage(h);
}
function renderStake(){ setStage('<div class="label">the stake</div><div class="huge" style="font-size:clamp(30px,6vw,90px)">PLACE&nbsp;YOUR&nbsp;BET</div>'); }
function renderTrade(){ setStage('<div class="label">the trade</div><div class="huge" style="font-size:clamp(30px,6vw,90px)">EXECUTE</div>'); }
function renderSummary(m){
  const s=m.state||{}; const col=s.auraColor; const cards=Array.isArray(s.cards)?s.cards:[];
  let cardsHtml='';
  if(cards.length){ cardsHtml='<div class="cards" style="margin-top:2vh">';
    cards.forEach((c,i)=>{ const img=c.img?'<img src="'+esc(c.img)+'" alt="">':''; cardsHtml+='<div class="card" style="width:min(18vh,22vw);animation-delay:'+(i*0.3)+'s">'+img+'<div class="cn">'+esc(c.n||'')+'</div></div>'; });
    cardsHtml+='</div>'; }
  setStage('<div class="label">the verdict</div>'+
    '<div class="huge" style="font-size:clamp(26px,5vw,72px)">'+esc(m.name||'')+'</div>'+
    '<div class="kv">'+
      '<div class="cell"><div class="k">AURA</div><div class="v" style="color:'+(col&&col.hex?col.hex:'#ffb347')+'">'+esc(col?col.n:'—')+'</div></div>'+
      '<div class="cell"><div class="k">WHEEL</div><div class="v">'+esc(s.wheelResult||'—')+'</div></div>'+
    '</div>'+cardsHtml);
}

const ROUTES={
  'screen-intro':renderIdle, 'screen-identify':renderIdentify, 'screen-subject':renderSubject,
  'screen-questions':renderQuestions, 'screen-body':renderBody, 'screen-voice':renderVoice,
  'screen-cognitive':renderCognitive, 'screen-wheel':renderWheel, 'screen-ritual':renderRitual,
  'screen-stake':renderStake, 'screen-trade':renderTrade, 'screen-summary':renderSummary
};

function apply(m){
  const screen=m.screen||'screen-intro';
  const key=screen+'|'+(m.mediaSrc||'')+'|'+((m.state&&Array.isArray(m.state.cards))?m.state.cards.length:0);
  if(screen==='screen-identify' && m.mediaSrc && cur.key===key){
    const n=stage.querySelector('.identify-name .n'); if(n) n.textContent=(m.name||m.nameInput||'').trim();
    return;
  }
  if(key===cur.key && screen!=='screen-questions' && screen!=='screen-body') return;
  cur.key=key;
  (ROUTES[screen]||renderIdle)(m);
}

/* המרת הודעת cue ישנה (מהמאוורר) למבנה mirror */
function fromCue(msg){
  const a=msg.action||{}; const out={screen:'screen-intro',state:{}};
  if(msg.cue==='reset'||a.power==='off'){ out.screen='screen-intro'; return out; }
  if(a.name){ const mm=matchMedia(a.name); out.screen='screen-identify'; out.name=a.name; out.mediaSrc=mm?mm.src:null; return out; }
  if(msg.cue==='identify'){ out.screen='screen-identify'; return out; }
  return out;
}

let client=null;
function connect(){
  try{
    client=mqtt.connect(RT.url,{reconnectPeriod:3000,connectTimeout:8000,clean:true,clientId:'stomack-display-'+Math.random().toString(16).slice(2,10)});
    client.on('connect',()=>{ dot.classList.add('on'); statusEl.textContent='LIVE'; client.subscribe(RT.topic); });
    client.on('reconnect',()=>{ statusEl.textContent='RECONNECTING…'; dot.classList.remove('on'); });
    client.on('close',()=>{ statusEl.textContent='OFFLINE'; dot.classList.remove('on'); });
    client.on('error',()=>{ statusEl.textContent='ERROR'; dot.classList.remove('on'); });
    client.on('message',(topic,buf)=>{
      let msg; try{ msg=JSON.parse(buf.toString('utf8')); }catch(e){ return; }
      if(!msg) return;
      if(msg.t==='mirror') return apply(msg);
      if(msg.t==='cue')    return apply(fromCue(msg));
    });
  }catch(e){ statusEl.textContent='NO LIB'; }
}

renderIdle();
if(window.mqtt) connect(); else { statusEl.textContent='NO LIB'; }

document.body.addEventListener('click',()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
});
setTimeout(()=>{ const h=document.getElementById('hint'); if(h) h.style.display='none'; }, 8000);
</script>
</body>
</html>
